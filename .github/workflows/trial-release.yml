# Builds the trial app, "MA Trial", which installs next to the store app.
# Tags v*: the signed APK is attached to a GitHub Release of this fork, where
# Komi Store picks it up. The key is this fork's own, so updates install over
# each other but never over the store app.
name: Trial release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches versionName
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(sed -nE 's/^ *versionName *= *"([^"]+)".*/\1/p' androidApp/build.gradle.kts)
          [ "$want" = "$have" ] || { echo "::error::tag $GITHUB_REF_NAME but versionName is $have"; exit 1; }

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MA_TRIAL_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MA_TRIAL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MA_TRIAL_KEY_ALIAS }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::secret MA_TRIAL_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/trial.jks"
          cat > androidApp/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/trial.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew :androidApp:assembleRelease
          cp androidApp/build/outputs/apk/release/*arm64-v8a*.apk "$RUNNER_TEMP/MA-Trial-$GITHUB_REF_NAME.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/MA-Trial-${{ github.ref_name }}.apk
          body_path: TRIAL.md
